      /* Ensure window.fetch is writable and handle getter-only environments for extensions */
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' ? window.fetch : null;
          var storedFetch = originalFetch ? originalFetch.bind(window) : null;
          var descriptor = {
            configurable: true,
            enumerable: true,
            get: function() {
              return storedFetch;

            set: function(fn) {

            }

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (_) {}
          }

          if (typeof globalThis !== 'undefined' && globalThis !== window) {

              Object.defineProperty(globalThis, 'fetch', descriptor);
            } catch (_) {}
          }
        } catch (_) {}

        // Intercept and swallow any rogue extension errors relating to 'fetch' or 'getter'
        window.addEventListener('error', function(event) {
          if (event && event.message && (event.message.indexOf('fetch') !== -1 || event.message.indexOf('getter') !== -1)) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();

    <!-- Trailing slash redirect guard for GitHub Pages subfolder hosting -->
